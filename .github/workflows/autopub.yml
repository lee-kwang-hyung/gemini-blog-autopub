name: Gemini Blog Autopub v1.0

on:
  schedule:
    # KST 09:00, 18:00 (UTC 00:00, 09:00) -> 일 최대 2회 실행
    - cron: "0 0,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  BLOGGER_CREDENTIALS_JSON: ${{ secrets.BLOGGER_CREDENTIALS_JSON }}
  PYTHONUNBUFFERED: "1"

concurrency:
  group: gemini-travel-review-writer
  cancel-in-progress: false

jobs:
  run-autopub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai requests beautifulsoup4 google-api-python-client google-auth

      - name: Run pipeline
        run: python -u src/main.py

      - name: Commit Naver semi-auto drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/naver
          git diff --staged --quiet || git commit -m "chore: update naver semi-auto drafts"
          git push
